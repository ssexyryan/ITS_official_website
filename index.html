<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MINI RTS Duel</title><style>
*{box-sizing:border-box}body{font:15px system-ui;background:#0c1420;color:#e7f1ff;margin:0}main{max-width:950px;margin:25px auto;padding:0 14px}h1{margin-bottom:4px}small{color:#9db0c8}button{border:0;background:#2876da;color:white;border-radius:8px;padding:11px 14px;cursor:pointer;font-weight:bold}input{border:1px solid #34465c;background:#152538;color:white;border-radius:8px;padding:10px;width:140px}canvas{width:100%;border:1px solid #385571;border-radius:10px;cursor:crosshair;touch-action:none}#lobby,#actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:14px 0}#status{padding:10px 0;color:#b0cced}#copy{display:none}
</style></head><body><main><h1>⚔️ MINI RTS DUEL</h1><small>1:1 실시간 전략 대전 · 상대 본진을 파괴하면 승리!</small><div id="lobby"><button id="new">새 방 만들기</button><input id="code" placeholder="방 코드"><button id="join">방 참여</button><button id="copy">초대 링크 복사</button></div><div id="status">방을 만들어 주세요.</div><canvas id="c" width="900" height="550"></canvas><div id="actions"><strong id="gold">미네랄 0</strong><button id="scout">Q · 스카우트 50</button><button id="tank">W · 탱크 120</button><small>좌클릭/드래그 선택 · 우클릭 이동 · 자동 공격</small></div></main><script>
const c=document.querySelector('#c'),ctx=c.getContext('2d'),status=document.querySelector('#status');let ws,side=-1,room='',state=null,selected=[],start=null,cursor={x:0,y:0};
function say(t){status.textContent=t}function send(o){if(ws?.readyState===1)ws.send(JSON.stringify(o))}
function join(id){ws?.close();ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>send({type:'join',id});ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='joined'){side=m.s;room=m.id;history.replaceState(null,'','/room/'+room);document.querySelector('#copy').style.display='inline-block';say('플레이어 '+(side+1)+' · 상대방 접속 대기')}if(m.type==='state'){state=m;document.querySelector('#gold').textContent='미네랄 '+Math.floor(m.gold[side]||0);if(m.winner!==null)say(m.winner===side?'승리!':'패배!');else if(m.started)say('대전 진행 중 · '+(side?'빨강':'파랑')+' 팀');else say('상대방 접속 대기');selected=selected.filter(id=>m.units.some(u=>u.id===id&&u.s===side))}if(m.type==='error'||m.type==='notice')say(m.message)};ws.onclose=()=>say('연결이 종료되었습니다. 다시 접속해 주세요.')}
document.querySelector('#new').onclick=()=>join('NEW');document.querySelector('#join').onclick=()=>join(document.querySelector('#code').value.trim().toUpperCase());document.querySelector('#copy').onclick=async()=>{let url=location.origin+'/room/'+room;try{await navigator.clipboard.writeText(url);say('링크 복사 완료: '+url)}catch{prompt('링크를 복사하세요',url)}};function produce(k){send({type:'produce',kind:k})}document.querySelector('#scout').onclick=()=>produce('scout');document.querySelector('#tank').onclick=()=>produce('tank');document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key.toLowerCase()==='q')produce('scout');if(e.key.toLowerCase()==='w')produce('tank')});function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*900/r.width,y:(e.clientY-r.top)*550/r.height}}c.oncontextmenu=e=>e.preventDefault();c.addEventListener('pointerdown',e=>{if(e.button===2){let p=pos(e);send({type:'move',ids:selected,x:p.x,y:p.y});return}if(e.button===0){start=pos(e);c.setPointerCapture(e.pointerId)}});c.addEventListener('pointermove',e=>cursor=pos(e));c.addEventListener('pointerup',e=>{if(!start||!state)return;let p=pos(e),a=start;start=null;let owned=state.units.filter(u=>u.s===side);let hits=Math.hypot(p.x-a.x,p.y-a.y)<8?owned.filter(u=>Math.hypot(u.x-p.x,u.y-p.y)<22):owned.filter(u=>u.x>=Math.min(a.x,p.x)&&u.x<=Math.max(a.x,p.x)&&u.y>=Math.min(a.y,p.y)&&u.y<=Math.max(a.y,p.y));selected=hits.map(u=>u.id)});
function draw(){ctx.fillStyle='#162a3a';ctx.fillRect(0,0,900,550);ctx.strokeStyle='#234054';for(let x=0;x<900;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,550);ctx.stroke()}for(let y=0;y<550;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke()}if(state){for(let b of state.bases){ctx.fillStyle=b.s?'#ba405b':'#367cce';ctx.fillRect(b.x-35,b.y-45,70,90);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='14px sans-serif';ctx.fillText('본진',b.x,b.y+5);ctx.fillStyle='#61c781';ctx.fillRect(b.x-38,b.y-56,76*Math.max(0,b.hp)/1000,6)}for(let u of state.units){ctx.fillStyle=u.s?'#ff7789':'#63b5ff';ctx.beginPath();ctx.arc(u.x,u.y,u.k==='tank'?16:11,0,7);ctx.fill();if(selected.includes(u.id)){ctx.strokeStyle='#ffdf6c';ctx.lineWidth=2;ctx.beginPath();ctx.arc(u.x,u.y,22,0,7);ctx.stroke()}ctx.fillStyle='#65cf82';ctx.fillRect(u.x-14,u.y-24,28*Math.max(0,u.hp)/(u.k==='tank'?160:75),4)}}if(start){ctx.strokeStyle='#ffdf6c';ctx.strokeRect(Math.min(start.x,cursor.x),Math.min(start.y,cursor.y),Math.abs(start.x-cursor.x),Math.abs(start.y-cursor.y))}requestAnimationFrame(draw)}let match=location.pathname.match(/^\/room\/([A-Fa-f0-9]{8})/);if(match)join(match[1].toUpperCase());draw();
</script></body></html>
